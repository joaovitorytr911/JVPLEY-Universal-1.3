name: Build JVPLEY ETS2 Telemetry DLL

on:
  push:
    branches: [main]
    paths:
      - "Plugin/**"
      - ".github/workflows/build-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-plugin:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build SCS telemetry plugin (Windows x64)
        run: cargo build --manifest-path Plugin/Cargo.toml --release --target x86_64-pc-windows-msvc
      - name: Publish DLL
        uses: actions/upload-artifact@v4
        with:
          name: JVPLEY-ETS2-x64-DLL
          path: Plugin/target/x86_64-pc-windows-msvc/release/JVPLEY_ETS2.dll
          if-no-files-found: error
          retention-days: 14
